<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Freelancing By Rifat</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/theme.css?v=2">
    <script src="assets/js/config.js?v=1782024132023"></script>
    <link rel="stylesheet" href="assets/css/premium-icons.css">
    <style>
        .auth-container { max-width: 420px; margin: 60px auto; padding: 30px 24px; background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-icon { width: 64px; height: 64px; background: rgba(255,149,0,0.1); color: #FF9500; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .auth-icon i { font-size: 32px; width: 32px; height: 32px; }
        .auth-title { font-size: 24px; font-weight: 900; color: var(--text-dark); margin-bottom: 8px; }
        .auth-subtitle { font-size: 14px; color: var(--text-muted); }

        .auth-form .form-group { margin-bottom: 16px; }
        .auth-form label { display: block; font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
        .auth-form input { width: 100%; padding: 14px 16px; font-size: 15px; border: 1.5px solid var(--border); border-radius: 10px; transition: 0.2s; background: #fafafa; }
        .auth-form input:focus { border-color: var(--primary); background: #fff; outline: none; box-shadow: 0 0 0 4px rgba(255,77,77,0.1); }
        
        .auth-btn { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.25s; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; }
        .auth-btn:hover { background: #e03131; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,77,77,0.25); }
        .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted); }
        .auth-footer a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        
        .auth-msg { padding: 12px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 600; margin-bottom: 20px; display: none; text-align: center; }
        .auth-msg.error { background: rgba(239,68,68,0.1); color: #b91c1c; }
        .auth-msg.success { background: rgba(34,197,94,0.1); color: #15803d; }

        #step2 { display: none; }

        @media (max-width: 480px) {
            .auth-container { margin: 30px 16px; padding: 24px 20px; }
        }
    </style>
</head>
<body style="background: var(--bg-body);">

<nav class="navbar">
    <a href="login.html" class="nav-icon-btn">←</a>
    <a href="index.html" class="navbar-brand">
        <i data-lucide="shopping-bag" class="lucide-icon icon-pulse"></i> 
        <span id="navBrand">Reset Password</span>
    </a>
</nav>

<div class="container">
    <div class="auth-container">
        
        <div class="auth-msg" id="alertMsg"></div>

        <!-- STEP 1: Request OTP -->
        <div id="step1">
            <div class="auth-header">
                <div class="auth-icon"><i data-lucide="key"></i></div>
                <h1 class="auth-title">Forgot Password</h1>
                <p class="auth-subtitle">Enter your email to receive an OTP.</p>
            </div>

            <form class="auth-form" id="forgotForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <button type="submit" class="auth-btn" id="btnForgot">
                    Send OTP <i data-lucide="send" class="lucide-icon"></i>
                </button>
            </form>
        </div>

        <!-- STEP 2: Verify OTP & Reset -->
        <div id="step2">
            <div class="auth-header">
                <div class="auth-icon"><i data-lucide="unlock"></i></div>
                <h1 class="auth-title">Set New Password</h1>
                <p class="auth-subtitle">Check your email for the 6-digit OTP.</p>
            </div>

            <form class="auth-form" id="resetForm">
                <div class="form-group">
                    <label>6-Digit OTP</label>
                    <input type="text" id="otp" placeholder="123456" required maxlength="6" style="letter-spacing: 4px; font-weight: bold; text-align: center;">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Min 6 characters" required minlength="6">
                </div>
                <button type="submit" class="auth-btn" id="btnReset">
                    Reset Password <i data-lucide="check-circle" class="lucide-icon"></i>
                </button>
            </form>
        </div>

        <div class="auth-footer">
            Remember your password? <a href="login.html">Sign In</a>
        </div>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
    });

    const apiBase = (typeof CONFIG !== 'undefined' && CONFIG.API_BASE) ? CONFIG.API_BASE : '';
    let currentEmail = '';

    function showAlert(msg, type = 'error') {
        const el = document.getElementById('alertMsg');
        el.textContent = msg;
        el.className = `auth-msg ${type}`;
        el.style.display = 'block';
    }

    // Step 1: Send OTP
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnForgot');
        const email = document.getElementById('email').value.trim();
        
        btn.disabled = true;
        btn.innerHTML = 'Sending... <div class="spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;margin-left:8px;"></div>';
        document.getElementById('alertMsg').style.display = 'none';

        try {
            const res = await fetch(`${apiBase}/api/user/forgot`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                currentEmail = email;
                showAlert(data.message || 'OTP Sent successfully!', 'success');
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            } else {
                throw new Error(data.error || 'Failed to send OTP');
            }
        } catch (err) {
            showAlert(err.message);
            btn.disabled = false;
            btn.innerHTML = 'Send OTP <i data-lucide="send" class="lucide-icon"></i>';
            lucide.createIcons();
        }
    });

    // Step 2: Reset Password
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnReset');
        const otp = document.getElementById('otp').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        
        btn.disabled = true;
        btn.innerHTML = 'Resetting... <div class="spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;margin-left:8px;"></div>';
        document.getElementById('alertMsg').style.display = 'none';

        try {
            const res = await fetch(`${apiBase}/api/user/reset`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentEmail, otp, newPassword })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                showAlert('Password reset successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                throw new Error(data.error || 'Failed to reset password');
            }
        } catch (err) {
            showAlert(err.message);
            btn.disabled = false;
            btn.innerHTML = 'Reset Password <i data-lucide="check-circle" class="lucide-icon"></i>';
            lucide.createIcons();
        }
    });
</script>

</body>
</html>
