<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 0; color: #000; background: #fff; }
        .invoice-box { max-width: 800px; margin: 0 auto; padding: 15px; font-size: 13px; line-height: 16px; }
        
        .no-print { text-align: center; padding: 10px; background: #f0f0f0; margin-bottom: 15px; border-bottom: 1px solid #ddd; }
        .no-print button { padding: 8px 16px; font-size: 13px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-print { background: #000; color: #fff; margin-right: 10px; }
        .btn-close { background: #ddd; color: #000; }

        /* Store Header - Center Aligned */
        .store-header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .store-header img { max-height: 60px; max-width: 180px; margin-bottom: 5px; }
        .store-header h1 { margin: 0 0 5px 0; font-size: 22px; font-weight: bold; text-transform: uppercase; }
        .store-header p { margin: 2px 0; color: #333; font-size: 12px; }

        /* Delivery Slip Block */
        .delivery-slip { border: 2px dashed #000; padding: 12px; margin-bottom: 15px; border-radius: 6px; }
        .delivery-slip-title { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; text-decoration: underline; }
        
        .address-container { width: 100%; margin-bottom: 10px; }
        .address-box { width: 48%; display: inline-block; vertical-align: top; }
        .address-box h3 { margin: 0 0 6px 0; font-size: 12px; text-transform: uppercase; color: #555; border-bottom: 1px solid #ccc; padding-bottom: 3px; }
        .address-box p { margin: 3px 0; font-size: 13px; }
        .address-box strong { font-size: 14px; }

        .cod-amount { text-align: center; font-size: 16px; font-weight: bold; border: 2px solid #000; padding: 8px; border-radius: 4px; margin-top: 10px; background: #f9f9f9; }

        /* Order Meta Info */
        .order-meta-table { width: 100%; margin-bottom: 15px; }
        .order-meta-table td { padding: 3px 0; }
        .meta-label { font-weight: bold; width: 100px; }

        /* Items Table */
        .items-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .items-table th, .items-table td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
        .items-table th { background: #f5f5f5; font-weight: bold; text-transform: uppercase; font-size: 11px; }
        .items-table td.money { text-align: right; }
        .items-table th.money { text-align: right; }

        /* Totals */
        .totals-container { width: 100%; text-align: right; }
        .totals-table { width: 300px; display: inline-table; border-collapse: collapse; }
        .totals-table td { padding: 6px 8px; border-bottom: 1px solid #eee; }
        .totals-table tr:last-child td { border-bottom: none; border-top: 2px solid #000; font-weight: bold; font-size: 16px; padding-top: 8px; }

        .footer-note { text-align: center; margin-top: 15px; font-size: 11px; color: #666; border-top: 1px solid #ddd; padding-top: 10px; }

        @media print {
            .no-print { display: none !important; }
            @page { margin: 0.5cm; } /* Reduce default browser margin */
            body, .invoice-box { background: #fff; margin: 0; padding: 0; width: 100%; max-width: 100%; font-size: 12px; line-height: 1.3; }
            .delivery-slip { page-break-inside: avoid; margin-bottom: 15px; }
            .store-header { padding-top: 0; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <button class="btn-print" onclick="window.print()">Print Invoice</button>
    <button class="btn-close" onclick="window.close()">Close</button>
</div>

<div class="invoice-box" id="invoiceContainer">
    <!-- Rendered via JS -->
</div>

<script src="assets/js/config.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var orderDataStr = localStorage.getItem('print_order');
        var printType = localStorage.getItem('print_type'); // 'bill' or 'full'
        if (!orderDataStr) {
            document.getElementById('invoiceContainer').innerHTML = '<p style="text-align:center;">No order data found.</p>';
            return;
        }
        
        var o = JSON.parse(orderDataStr);
        var s = {};
        try {
            var publicData = JSON.parse(localStorage.getItem('__fbr_public_data') || '{}');
            if (publicData && publicData.data && publicData.data.settings) {
                s = publicData.data.settings;
            }
        } catch(e) {}

        var storeName = s.store_name || CONFIG.STORE_NAME || 'Store Name';
        var storeAddress = s.store_address || '';
        var storePhone = s.contact_phone || s.whatsapp_number || '';
        var storeEmail = s.contact_email || '';
        var logoUrl = s.logo_url || '';

        var html = '';

        // --- TOP HEADER ---
        html += '<table style="width:100%; margin-bottom:15px;"><tr>';
        html += '<td style="vertical-align:top; width:50%;">';
        
        html += '<div style="display:flex; align-items:center; gap:12px;">';
        if (logoUrl) {
            html += '<img src="' + logoUrl + '" alt="Store Logo" style="max-height:50px; max-width:120px; border-radius:4px;">';
        }
        html += '<h1 style="margin:0; font-size:20px; text-transform:uppercase; font-weight:800; color:#111;">' + storeName + '</h1>';
        html += '</div>';

        if (printType === 'full') {
             html += '<div style="margin-top:12px; font-size:13px; font-weight:bold; text-transform:uppercase; letter-spacing:1px; background:#000; color:#fff; display:inline-block; padding:4px 10px; border-radius:4px;">Delivery Slip</div>';
        } else {
             html += '<div style="margin-top:12px; font-size:13px; font-weight:bold; text-transform:uppercase; letter-spacing:1px; color:#555; display:inline-block; padding:4px 0;">Customer Invoice</div>';
        }
        html += '</td>';
        
        html += '<td style="vertical-align:top; text-align:right; width:50%; font-size:13px;">';
        html += '<table style="width:100%; text-align:right;">';
        html += '<tr><td style="font-weight:bold; width:120px; padding-bottom:4px;">Invoice No:</td><td style="padding-bottom:4px;">#' + o.id + '</td></tr>';
        html += '<tr><td style="font-weight:bold; padding-bottom:4px;">Date:</td><td style="padding-bottom:4px;">' + new Date(o.created_at).toLocaleDateString() + '</td></tr>';
        html += '<tr><td style="font-weight:bold; padding-bottom:4px;">Order Type:</td><td style="padding-bottom:4px;">' + (o.order_type === 'pickup' ? 'Store Pickup' : 'Home Delivery') + '</td></tr>';
        html += '<tr><td style="font-weight:bold;">Payment:</td><td>' + (o.payment_method || 'COD') + ' (' + (o.payment_status || 'Unpaid') + ')</td></tr>';
        html += '</table>';
        html += '</td>';
        html += '</tr></table>';

        // --- ADDRESS BLOCK ---
        html += '<div style="display:flex; justify-content:space-between; margin-bottom:20px; border-top:2px solid #000; border-bottom:2px solid #000; padding:15px 0;">';
        
        // SENDER
        html += '<div style="width:48%;">';
        html += '<h3 style="margin:0 0 8px; font-size:12px; color:#666; text-transform:uppercase;">From (Sender):</h3>';
        html += '<p style="margin:0; font-weight:bold; font-size:14px;">' + storeName + '</p>';
        if (storePhone) html += '<p style="margin:4px 0 0; font-size:13px;">Phone: ' + storePhone + '</p>';
        if (storeAddress) html += '<p style="margin:4px 0 0; font-size:13px; line-height:1.4;">' + storeAddress.replace(/\\n/g, ', ') + '</p>';
        html += '</div>';

        // RECEIVER / CUSTOMER
        html += '<div style="width:48%;">';
        html += '<h3 style="margin:0 0 8px; font-size:12px; color:#666; text-transform:uppercase;">' + (printType === 'full' ? 'To (Receiver):' : 'Billed To:') + '</h3>';
        html += '<p style="margin:0; font-weight:bold; font-size:14px;">' + (o.customer_name || 'N/A') + '</p>';
        html += '<p style="margin:4px 0 0; font-size:13px;">Phone: ' + (o.customer_phone || 'N/A') + '</p>';
        var customerAddr = o.address || o.customer_address || '';
        if (customerAddr) {
             html += '<p style="margin:4px 0 0; font-size:13px; line-height:1.4;">' + customerAddr.replace(/\\n/g, '<br>') + (o.upazila ? ', ' + o.upazila : '') + (o.district ? ', ' + o.district : '') + '</p>';
        }
        html += '</div>';
        
        html += '</div>';

        // --- AMOUNT TO COLLECT (Only for full) ---
        if (printType === 'full') {
            var grandTotal = parseFloat(o.grand_total || 0);
            var advanceAmt = parseFloat(o.advance_payable || 0);
            var codAmount = (grandTotal - advanceAmt).toFixed(2);
            
            if (o.payment_method === 'COD' && (o.payment_status || '').toLowerCase() !== 'paid') {
                var advText = advanceAmt > 0 ? ' <small style="font-weight:normal;color:#555;">(After ৳' + advanceAmt.toFixed(2) + ' Advance)</small>' : '';
                html += '<div style="text-align:center; font-size:16px; font-weight:bold; border:2px dashed #000; padding:10px; border-radius:4px; margin-bottom:20px; background:#f9f9f9;">Amount to Collect (COD): ৳' + codAmount + advText + '</div>';
            } else {
                html += '<div style="text-align:center; font-size:16px; font-weight:bold; border:2px solid #ccc; padding:10px; border-radius:4px; margin-bottom:20px; color:#555;">Payment Status: ' + (o.payment_status || 'Paid').toUpperCase() + ' (' + (o.payment_method || 'Online') + ')</div>';
            }
        }

        // Items Table
        html += '<table class="items-table">';
        html += '<thead><tr><th>Item Description</th><th style="width:60px;text-align:center;">Qty</th><th class="money" style="width:100px;">Unit Price</th><th class="money" style="width:100px;">Total</th></tr></thead>';
        html += '<tbody>';
        var items = o.items || [];
        if(items.length === 0) {
             html += '<tr><td colspan="4" style="text-align:center;">No items found</td></tr>';
        } else {
            items.forEach(function(item) {
                var varText = [];
                if (item.color) varText.push('Color: ' + item.color);
                if (item.size) varText.push('Size: ' + item.size);
                var varStr = varText.length ? ' <br><small style="color:#666;">(' + varText.join(', ') + ')</small>' : '';
                var price = parseFloat(item.price || 0);
                var qty = parseInt(item.quantity || 1);
                html += '<tr>';
                html += '<td><strong>' + (item.productName || 'Product') + '</strong>' + varStr + '</td>';
                html += '<td style="text-align:center;">' + qty + '</td>';
                html += '<td class="money">৳' + price.toFixed(2) + '</td>';
                html += '<td class="money">৳' + (price * qty).toFixed(2) + '</td>';
                html += '</tr>';
            });
        }
        html += '</tbody>';
        html += '</table>';

        // Totals
        var sub = parseFloat(o.subtotal || o.grand_total - (o.delivery_charge || 0));
        var dc = parseFloat(o.delivery_charge || 0);
        var grand = parseFloat(o.grand_total || 0);
        var discount = parseFloat(o.discount_amount || 0);
        var advanceAmt = parseFloat(o.advance_payable || 0);

        html += '<div class="totals-container">';
        html += '<table class="totals-table">';
        html += '<tr><td>Subtotal:</td><td style="text-align:right;">৳' + sub.toFixed(2) + '</td></tr>';
        if (dc > 0) {
            html += '<tr><td>Delivery Charge:</td><td style="text-align:right;">৳' + dc.toFixed(2) + '</td></tr>';
        }
        if (discount > 0) {
            html += '<tr><td style="color:green;">Discount:</td><td style="text-align:right;color:green;">- ৳' + discount.toFixed(2) + '</td></tr>';
        }
        html += '<tr style="border-top: 2px solid #000; font-weight: bold;"><td>Total Amount:</td><td style="text-align:right;">৳' + grand.toFixed(2) + '</td></tr>';
        
        if (advanceAmt > 0) {
            html += '<tr><td>Advance Paid:</td><td style="text-align:right; color:green;">- ৳' + advanceAmt.toFixed(2) + '</td></tr>';
            html += '<tr style="font-size:16px;"><td>Due Amount (COD):</td><td style="text-align:right; font-weight:bold; font-size:18px;">৳' + (grand - advanceAmt).toFixed(2) + '</td></tr>';
        }
        html += '</table>';
        html += '</div>';

        // Footer Note
        html += '<div class="footer-note">';
        html += '<strong>Thank you for shopping with us!</strong><br>';
        html += 'If you have any questions about this invoice, please contact our support.';
        html += '</div>';

        document.getElementById('invoiceContainer').innerHTML = html;
        
        // Removed auto print to let the user see the layout first and prevent blank screen issues in Chrome
    });
</script>
</body>
</html>
