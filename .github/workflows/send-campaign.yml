name: 📧 Email Sender (Gmail SMTP)

on:
  # ── Transactional trigger (Cloudflare Function calls this) ──
  repository_dispatch:
    types: [send-transactional-email]

  # ── Marketing campaign (manual trigger) ──
  workflow_dispatch:
    inputs:
      type:
        description: 'Email type'
        type: choice
        required: true
        options:
          - marketing-promo
          - marketing-newsletter
          - marketing-update
      subject:
        description: 'Subject line'
        required: false
        default: '🛍️ নতুন অফার!'
      test_email:
        description: 'Test only (single email) — ফাঁকা রাখলে সবাইকে পাঠাবে'
        required: false

  # ── Scheduled marketing (optional, comment out if not needed) ──
  # schedule:
  #   - cron: '0 3 * * 1'   # Every Monday 9am BD time

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install deps
        run: npm install
        working-directory: scripts

      # ── Transactional email (OTP, password reset, order confirm) ──
      - name: Send Transactional Email
        if: github.event_name == 'repository_dispatch'
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          STORE_NAME:     ${{ secrets.STORE_NAME }}
          STORE_URL:      ${{ secrets.STORE_URL }}
          EMAIL_TYPE:     ${{ github.event.client_payload.type }}
          TO_EMAIL:       ${{ github.event.client_payload.to_email }}
          TO_NAME:        ${{ github.event.client_payload.to_name }}
          OTP:            ${{ github.event.client_payload.otp }}
          ORDER_ID:       ${{ github.event.client_payload.order_id }}
          ORDER_STATUS:   ${{ github.event.client_payload.order_status }}
        run: node scripts/send-transactional.js

      # ── Marketing email (manual or scheduled) ──
      - name: Send Marketing Campaign
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          STORE_NAME:     ${{ secrets.STORE_NAME }}
          STORE_URL:      ${{ secrets.STORE_URL }}
          D1_API_URL:     ${{ secrets.D1_API_URL }}
          D1_ADMIN_TOKEN: ${{ secrets.D1_ADMIN_TOKEN }}
          EMAIL_TYPE:     ${{ github.event.inputs.type || 'marketing-promo' }}
          SUBJECT:        ${{ github.event.inputs.subject || '🛍️ নতুন অফার!' }}
          TEST_EMAIL:     ${{ github.event.inputs.test_email }}
        run: node scripts/send-campaign.js
