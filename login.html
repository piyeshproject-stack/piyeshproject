<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Freelancing By Rifat</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/tailwind.css?v=1791100000005">
    <script>document.write('<link rel="stylesheet" href="assets/css/theme.css?v=' + Date.now() + '">');</script>
    <script src="assets/js/config.js?v=1791100000002"></script>
    <link rel="stylesheet" href="assets/css/premium-icons.css">
    <style>
        .auth-container { max-width: 420px; margin: 60px auto; padding: 30px 24px; background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-icon { width: 64px; height: 64px; background: rgba(255,77,77,0.1); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .auth-icon i { font-size: 32px; width: 32px; height: 32px; }
        .auth-title { font-size: 24px; font-weight: 900; color: var(--text-dark); margin-bottom: 8px; }
        .auth-subtitle { font-size: 14px; color: var(--text-muted); }

        .auth-form .form-group { margin-bottom: 16px; }
        .auth-form label { display: block; font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
        .auth-form input { width: 100%; padding: 14px 16px; font-size: 15px; border: 1.5px solid var(--border); border-radius: 10px; transition: 0.2s; background: #fafafa; }
        .auth-form input:focus { border-color: var(--primary); background: #fff; outline: none; box-shadow: 0 0 0 4px rgba(255,77,77,0.1); }
        
        .auth-btn { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.25s; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; }
        .auth-btn:hover { background: #e03131; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,77,77,0.25); }
        .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted); }
        .auth-footer a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        
        .auth-error { background: rgba(239,68,68,0.1); color: #b91c1c; padding: 12px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 600; margin-bottom: 20px; display: none; text-align: center; }

        @media (max-width: 480px) {
            .auth-container { margin: 30px 16px; padding: 24px 20px; }
        }
    </style>
</head>
<body style="background: var(--bg-body);">

<!-- Navbar (Simplified) -->
<nav class="navbar">
    <a href="index.html" class="nav-icon-btn">←</a>
    <a href="index.html" class="navbar-brand">
        <i data-lucide="shopping-bag" class="lucide-icon icon-pulse"></i> 
        <span id="navBrand">Login</span>
    </a>
</nav>

<div class="container">
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-icon"><i data-lucide="user"></i></div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to manage your orders</p>
        </div>

        <div class="auth-error" id="errorMsg"></div>

        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <label style="margin: 0;">Password</label>
                    <a href="forgot-password.html" style="font-size: 13px; color: var(--primary); font-weight: 600; text-decoration: none;">Forgot?</a>
                </div>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="auth-btn" id="submitBtn">
                Sign In <i data-lucide="arrow-right" class="lucide-icon"></i>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        
        // If already logged in, redirect to profile
        if (localStorage.getItem('user_token')) {
            window.location.href = 'profile.html';
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const err = document.getElementById('errorMsg');
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        
        btn.disabled = true;
        btn.innerHTML = 'Signing in... <div class="spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;margin-left:8px;"></div>';
        err.style.display = 'none';

        try {
            const apiBase = (typeof CONFIG !== 'undefined' && CONFIG.API_BASE) ? CONFIG.API_BASE : '';
            const res = await fetch(`${apiBase}/api/user/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                // Save token
                localStorage.setItem('user_token', data.token);
                // Redirect
                window.location.href = 'profile.html';
            } else {
                throw new Error(data.error || 'Login failed');
            }
        } catch (error) {
            err.textContent = error.message;
            err.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = 'Sign In <i data-lucide="arrow-right" class="lucide-icon"></i>';
            lucide.createIcons();
        }
    });
</script>

</body>
</html>
